[tool.isort]
profile = "black"

[tool.ruff]
output-format = "github"

[tool.ruff.lint]
ignore = [
  "D211",
  "D212",
  "D10",
  "ANN",
  "RUF012",
  "PTH",
  "EM101",
  "S105",
  "ARG001",
  "ARG002",
  "PT",
  "PLR2004",
  "CPY001",
  "TRY003"
]
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 16
